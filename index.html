<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STUDENT</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    button {
      padding: 6px 12px;
      margin-right: 8px;
      cursor: pointer;
    }

    .api-link {
      margin: 15px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #333;
      padding: 8px 12px;
      text-align: left;
    }

    th {
      font-weight: bold;
    }

    
    .col-user-id, .col-task-id {
      text-align: center;
      width: 80px;
    }

    
    .status-completed {
      color: #2e7d32;
      font-weight: bold;
    }

    .status-pending {
      color: #c62828;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Javascript Web Output #3</h1>

  <div>
    <button id="loadBtn">Load data from the API</button>
    <button id="clearBtn">Clear Table</button>
  </div>

  <p class="api-link">
    <strong>API:</strong> 
    <a href="https://jsonplaceholder.typicode.com/todos/" target="_blank">
      https://jsonplaceholder.typicode.com/todos/
    </a>
  </p>

  <table id="todoTable">
    <thead>
      <tr>
        <th class="col-user-id">User ID</th>
        <th class="col-task-id">Task ID</th>
        <th>Title</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="todoTableBody">
      
    </tbody>
  </table>

<script src="script.js"></script>

</body>
</html>
